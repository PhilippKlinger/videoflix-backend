# Actions are pinned by commit SHA; the comment shows the readable version.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only rules for real errors (syntax, undefined names) for now;
      # style rules follow with the planned code cleanup.
      - name: Lint Python code
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.1"
          args: check --select E9,F63,F7,F82

  test:
    name: Test (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: videoflix_test
          POSTGRES_USER: videoflix
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U videoflix -d videoflix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway values: tests must not depend on real secrets.
      SECRET_KEY: ci-only-not-secret-${{ github.run_id }}-padding-to-32-bytes
      DEBUG: "False"
      DB_NAME: videoflix_test
      DB_USER: videoflix
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_LOCATION: redis://localhost:6379/1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Python version as the Docker image.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install locked dependencies
        run: pip install -r requirements-dev.txt

      - name: Check project and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      # Coverage ratchet: start value from 2026-10-31. Raise it when coverage
      # grows, never lower it.
      - name: Run tests with coverage
        run: |
          coverage run --source=. --omit="*/migrations/*,*/tests.py,manage.py" manage.py test
          coverage report --fail-under=89

  image:
    name: Build, scan and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BuildKit container driver: needed for the GitHub Actions layer cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare image name
        id: name
        shell: bash
        run: |
          set -Eeuo pipefail
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=ghcr.io/${OWNER_LOWER}/videoflix-backend:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build image with layer cache
        env:
          IMAGE: ${{ steps.name.outputs.ref }}
        run: |
          set -Eeuo pipefail
          docker buildx build \
            --file "backend.Dockerfile" \
            --cache-from "type=gha,scope=videoflix-backend" \
            --cache-to "type=gha,mode=max,scope=videoflix-backend" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --build-arg "GIT_SHA=${GITHUB_SHA}" \
            --build-arg "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "${IMAGE}" \
            --load \
            .

      # Official Trivy image pinned by digest instead of a third-party action.
      # Fails on critical findings that already have a fix.
      - name: Scan image with Trivy
        env:
          IMAGE: ${{ steps.name.outputs.ref }}
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --no-progress --severity HIGH,CRITICAL --ignore-unfixed "${IMAGE}"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --no-progress --quiet --severity CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE}"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      # The digest makes the reference immutable: the deploy repository pins exactly this build.
      - name: Push image and record immutable reference
        id: push
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ steps.name.outputs.ref }}
        run: |
          set -Eeuo pipefail
          PUSH_OUTPUT="$(docker push "${IMAGE}")"
          echo "${PUSH_OUTPUT}"
          DIGEST="$(awk '/digest: sha256:/ {print $3}' <<< "${PUSH_OUTPUT}" | tail -n 1)"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "### Image" >> "${GITHUB_STEP_SUMMARY}"
          echo '`'"${IMAGE}@${DIGEST}"'`' >> "${GITHUB_STEP_SUMMARY}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      # Last step on purpose: the deploy only starts for an image that passed everything above.
      - name: Trigger deploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -Eeuo pipefail
          jq -n --arg digest "${DIGEST}" \
            '{event_type: "image-published", client_payload: {service: "backend", digest: $digest}}' |
            gh api --method POST repos/PhilippKlinger/videoflix-deploy/dispatches --input -
