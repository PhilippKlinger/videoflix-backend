<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body style="font-family: sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div style="max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px;">
        <img src="http://127.0.0.1:8000/static/img/logo.svg" alt="Videoflix Logo" style="max-width: 180px;">

        <h2>{{ title }}</h2>
        <br>
        <p>{{ message }}</p>
        <br>
        <a href="{{ button_url }}" style="display: inline-block; background-color: #302DFB; color: white; padding: 12px 24px; text-decoration: none; border-radius: 24px; font-weight: bold;">
            {{ button_text }}
        </a>
        <br>
        <p style="margin-top: 30px; font-size: 12px; color: #888;">
            {{ hint }}
        </p>
        <p style="margin-top: 30px; font-size: 12px; color: #888;">
            {{ advice }}
        </p>
        <br>
        <p style="font-size: 12px; color: #888;">
            – Your Videoflix Team
        </p>
    </div>
</body>
</html>
