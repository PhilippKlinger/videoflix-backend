# Actions are pinned by commit SHA; the comment shows the readable version.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only rules for real errors (syntax, undefined names) for now;
      # style rules follow with the planned code cleanup.
      - name: Lint Python code
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.1"
          args: check --select E9,F63,F7,F82

  test:
    name: Test (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: videoflix_test
          POSTGRES_USER: videoflix
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U videoflix -d videoflix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway values: tests must not depend on real secrets.
      SECRET_KEY: ci-only-not-secret-${{ github.run_id }}-padding-to-32-bytes
      DEBUG: "False"
      DB_NAME: videoflix_test
      DB_USER: videoflix
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_LOCATION: redis://localhost:6379/1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Python version as the Docker image.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: pip install -r requirements.txt

      - name: Check project and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      # Coverage ratchet: start value from 2026-10-31. Raise it when coverage
      # grows, never lower it.
      - name: Run tests with coverage
        run: |
          coverage run --source=. --omit="*/migrations/*,*/tests.py,manage.py" manage.py test
          coverage report --fail-under=89
