services:

  db:
    image: postgres:18
    container_name: videoflix_database
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:latest
    container_name: videoflix_redis
    volumes:
      - redis_data:/data

  mailpit:
    # Dev profile: catches all mails, web UI and API at http://localhost:8025
    profiles: ["dev"]
    image: axllent/mailpit:v1.33
    container_name: videoflix_mailpit
    ports:
      - "127.0.0.1:8025:8025"

  web:
    # Dev profile
    profiles: ["dev"]
    build:
      context: .
      dockerfile: backend.Dockerfile
      args:
        REQUIREMENTS: requirements-dev.txt
    env_file: .env
    container_name: videoflix_backend_dev
    volumes:
      - .:/app
      - videoflix_media:/app/media
      - videoflix_static:/app/static
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - mailpit

  worker:
    # Dev profile: RQ worker for the video conversion, same image and code as web
    profiles: ["dev"]
    build:
      context: .
      dockerfile: backend.Dockerfile
      args:
        REQUIREMENTS: requirements-dev.txt
    command: ["worker"]
    env_file: .env
    container_name: videoflix_worker_dev
    volumes:
      - .:/app
      - videoflix_media:/app/media
    depends_on:
      - db
      - redis

  mail-worker:
    # Dev profile: RQ worker for account mails, sends to Mailpit
    profiles: ["dev"]
    build:
      context: .
      dockerfile: backend.Dockerfile
      args:
        REQUIREMENTS: requirements-dev.txt
    command: ["mail-worker"]
    env_file: .env
    container_name: videoflix_mail_worker_dev
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - mailpit

  web-prod:
    # Prod profile: local check of the production image (the server uses videoflix-deploy)
    profiles: ["prod"]
    build:
      context: .
      dockerfile: backend.Dockerfile
    env_file: .env
    container_name: videoflix_backend_prod
    # Static files are part of the image; only media is persisted
    volumes:
      - videoflix_media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: backend.Dockerfile
    command: ["worker"]
    env_file: .env
    container_name: videoflix_worker_prod
    volumes:
      - videoflix_media:/app/media
    depends_on:
      - db
      - redis

  mail-worker-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: backend.Dockerfile
    command: ["mail-worker"]
    env_file: .env
    container_name: videoflix_mail_worker_prod
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
  videoflix_media:
  videoflix_static:
